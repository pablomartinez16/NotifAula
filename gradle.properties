# Propiedades del proyecto UAL Notifier
# Configuración de la JVM para el daemon de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilitar AndroidX para todas las dependencias
android.useAndroidX=true

# Habilitar clases R no transitivas para evitar conflictos
android.nonTransitiveRClass=true
