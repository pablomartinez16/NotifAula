name: Build & Publish APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RELEASE_VERSION: v1.0.0

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode Release Keystore (if configured in Secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-keystore.jks"

      - name: Build Optimized Release APK (R8)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Rename Release APK to NotifAula.apk
        run: cp app/build/outputs/apk/release/app-release.apk NotifAula.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifAula-apk
          path: NotifAula.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: "NotifAula ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_VERSION }}"
          make_latest: "true"
          body_path: RELEASE_NOTES.md
          files: NotifAula.apk
          prerelease: false
