name: Build & Publish APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK to NotifAula.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk NotifAula.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifAula-apk
          path: NotifAula.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: "NotifAula ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}"
          make_latest: "true"
          body: |
            ### 📲 Descarga e instalación en Android
            1. Descarga el archivo **`NotifAula.apk`** que aparece abajo en **Assets**.
            2. Ábrelo en tu móvil Android para instalar **NotifAula**.
            3. Inicia sesión en la web oficial del Aula Virtual (`aulavirtual.ual.es`) y activa el permiso de notificaciones.
          files: NotifAula.apk
          prerelease: false
